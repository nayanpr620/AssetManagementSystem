name: Sync Backend to Hugging Face Space

on:
  push:
    branches:
      - main
    # Sirf tab trigger hoga jab hf_space folder me koi change hoga
    paths:
      - 'hf_space/**'

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Git user configure karein
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Hugging Face repo ko temporary folder me clone karein
          git clone https://nayanpr620:$HF_TOKEN@huggingface.co/spaces/nayanpr620/asset-management-system hf_repo
          cd hf_repo
          
          # Purani files clear karein (sirf .git aur .gitattributes ko chodkar)
          find . -maxdepth 1 -not -name '.git' -not -name '.gitattributes' -not -name '.' -exec rm -rf {} +
          
          # GitHub repo ke 'hf_space' folder ka sara content HF repo me copy karein
          cp -a ../hf_space/. .
          
          # Galti se bhi heavy test files/folders push na ho isliye unhe remove karein
          rm -rf uploads results .venv* 
          echo "uploads/" >> .gitignore
          echo "results/" >> .gitignore
          
          # Naye changes commit aur push karein
          git add .
          git commit -m "Auto-sync from GitHub (Commit: ${{ github.sha }})" || echo "No changes to commit"
          git push https://nayanpr620:$HF_TOKEN@huggingface.co/spaces/nayanpr620/asset-management-system main
